<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ecowise Intelligence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Recharts Omitted for native Tailwind Bars -->
    
    <style>
        body { margin: 0; background-color: #171717; color: #f5f5f5; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Simple SVG Icons since Lucide CDN is trickier in UMD
        const IconTarget = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const IconShield = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>;
        const IconUsers = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconActivity = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
        const IconRefresh = ({spinning}) => <svg width="20" height="20" className={spinning ? "animate-spin text-neutral-500" : "text-neutral-500"} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M21 21v-5h-5"/></svg>;

        function Dashboard() {
            const [data, setData] = useState({
                total_projects: 0,
                total_investors: 0,
                total_volunteers: 0,
                total_grants: 0,
                total_activities: 0,
                sector_distribution: [
                    { name: 'Loading...', val: 0 }
                ]
            });
            const [loading, setLoading] = useState(true);
            const [pipelineStatus, setPipelineStatus] = useState("SYSTEM.ONLINE");

            const loadData = async () => {
                try {
                setLoading(true);
                const host = "http://localhost:8000";
                const res = await fetch(`${host}/api/v1/analytics/overview`);
                if (res.ok) {
                    const json = await res.json();
                    setData(json);
                } else {
                    console.error("Failed to load analytics");
                    setPipelineStatus("API.ERROR");
                }
                } catch (e) {
                console.error(e);
                setPipelineStatus("NETWORK.ERROR");
                } finally {
                setLoading(false);
                }
            };

            const triggerIngest = async () => {
                try {
                setPipelineStatus("INGESTING...");
                await fetch("http://localhost:8000/api/v1/pipeline/ingest", { method: 'POST' });
                setTimeout(() => setPipelineStatus("SYSTEM.ONLINE"), 4000);
                } catch (e) {
                setPipelineStatus("INGEST.ERROR");
                }
            };
            
            const triggerRebuild = async () => {
                try {
                setPipelineStatus("REBUILDING MATRICES...");
                await fetch("http://localhost:8000/api/v1/pipeline/rebuild-features", { method: 'POST' });
                setTimeout(() => setPipelineStatus("SYSTEM.ONLINE"), 15000);
                } catch (e) {
                setPipelineStatus("REBUILD.ERROR");
                }
            };

            useEffect(() => {
                loadData();
            }, []);

            return (
                <div className="min-h-screen bg-neutral-900 text-neutral-100 p-8 font-sans">
                <header className="mb-10 border-b border-neutral-800 pb-6 flex justify-between items-center">
                    <div>
                    <h1 className="text-3xl font-light tracking-tight text-white flex items-center gap-3">
                        Ecowise Intelligence 
                        {loading && <IconRefresh spinning={true} />}
                    </h1>
                    <p className="text-neutral-400 mt-2 text-sm">Targeting {data.total_activities.toLocaleString()} historical impact cases globally</p>
                    </div>
                    <div className="flex gap-4">
                    <button onClick={triggerIngest} className="text-xs bg-neutral-800 border border-neutral-700 text-neutral-300 px-3 py-1 rounded hover:bg-neutral-700 transition cursor-pointer">
                        Run Data Ingest
                    </button>
                    <button onClick={triggerRebuild} className="text-xs bg-neutral-800 border border-neutral-700 text-neutral-300 px-3 py-1 rounded hover:bg-emerald-800 hover:text-emerald-100 transition cursor-pointer">
                        Recompile Vectors
                    </button>
                    <div className={`text-xs font-mono px-3 py-1 rounded border flex items-center ${pipelineStatus.includes("ERROR") ? 'bg-red-900 text-red-400 border-red-800' : 'bg-green-900 text-green-400 border-green-800'}`} style={{backgroundColor: pipelineStatus.includes("ERROR") ? "rgba(127, 29, 29, 0.3)" : "rgba(20, 83, 45, 0.2)"}}>
                        {pipelineStatus}
                    </div>
                    </div>
                </header>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                    <div className="bg-neutral-800 border border-neutral-700 p-6 rounded-xl shadow-lg transition" style={{backgroundColor: "rgba(38, 38, 38, 0.5)"}}>
                        <div className="flex justify-between items-start">
                        <div>
                            <p className="text-neutral-400 text-sm font-medium">Active Projects</p>
                            <h3 className="text-4xl font-semibold mt-2 text-white">{loading ? "-" : data.total_projects}</h3>
                        </div>
                        <div className="text-emerald-500"><IconTarget /></div>
                        </div>
                    </div>
                    <div className="bg-neutral-800 border border-neutral-700 p-6 rounded-xl shadow-lg transition" style={{backgroundColor: "rgba(38, 38, 38, 0.5)"}}>
                        <div className="flex justify-between items-start">
                        <div>
                            <p className="text-neutral-400 text-sm font-medium">Capital Investors</p>
                            <h3 className="text-4xl font-semibold mt-2 text-white">{loading ? "-" : data.total_investors}</h3>
                        </div>
                        <div className="text-emerald-500"><IconShield /></div>
                        </div>
                    </div>
                    <div className="bg-neutral-800 border border-neutral-700 p-6 rounded-xl shadow-lg transition" style={{backgroundColor: "rgba(38, 38, 38, 0.5)"}}>
                        <div className="flex justify-between items-start">
                        <div>
                            <p className="text-neutral-400 text-sm font-medium">Skill Volunteers</p>
                            <h3 className="text-4xl font-semibold mt-2 text-white">{loading ? "-" : data.total_volunteers}</h3>
                        </div>
                        <div className="text-emerald-500"><IconUsers /></div>
                        </div>
                    </div>
                    <div className="bg-neutral-800 border border-neutral-700 p-6 rounded-xl shadow-lg transition" style={{backgroundColor: "rgba(38, 38, 38, 0.5)"}}>
                        <div className="flex justify-between items-start">
                        <div>
                            <p className="text-neutral-400 text-sm font-medium">Grant Activities</p>
                            <h3 className="text-4xl font-semibold mt-2 text-white">{loading ? "-" : data.total_grants}</h3>
                        </div>
                        <div className="text-emerald-500"><IconActivity /></div>
                        </div>
                    </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-neutral-800 border border-neutral-700 p-6 rounded-xl relative overflow-hidden" style={{backgroundColor: "rgba(38, 38, 38, 0.4)"}}>
                    <h3 className="text-lg font-medium mb-6 text-white">Pipeline by Sector</h3>
                    <div style={{height: "250px"}} className="relative z-10">
                        <div className="flex flex-col gap-3 h-full justify-center text-sm text-neutral-300">
                            {data.sector_distribution.map((sec, i) => {
                                const maxVal = Math.max(...data.sector_distribution.map(d => d.val), 1);
                                const pct = Math.max(5, (sec.val / maxVal) * 100);
                                return (
                                    <div key={i} className="flex items-center gap-3">
                                        <div className="w-24 text-right truncate" style={{color: '#888'}}>{sec.name}</div>
                                        <div className="flex-1">
                                            <div className="h-5 bg-emerald-500 rounded-r-md" style={{width: `${pct}%`, transition: 'width 1s ease-in-out'}}></div>
                                        </div>
                                        <div className="w-8 text-neutral-400 font-mono text-xs">{sec.val}</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                    </div>

                    <div className="bg-neutral-800 border border-neutral-700 p-6 rounded-xl flex flex-col justify-between" style={{backgroundColor: "rgba(38, 38, 38, 0.4)"}}>
                    <div>
                        <h3 className="text-lg font-medium mb-6 text-white flex justify-between">
                        Orchestration Center
                        </h3>
                        <p className="text-sm text-neutral-400 leading-relaxed">
                        Ecowise matches live projects via hybrid structured rules intersecting dense semantic transformers. <br/><br/>
                        <b>Run Data Ingest</b> cleans raw <code>.json</code> schemas. <br/>
                        <b>Recompile Vectors</b> constructs multidimensional PyTorch arrays into memory for live endpoints.
                        </p>
                    </div>
                    <div className="mt-8 border-t border-neutral-700 pt-4 text-xs font-mono text-neutral-500" style={{borderColor: "rgba(64,64,64,0.5)"}}>
                        &gt; V_INDEX: {data.total_activities} PRECEDENTS LOADED<br/>
                        &gt; SEMANTIC_CORE: all-MiniLM-L6-v2<br/>
                        &gt; HEURISTIC_MAPS: VERIFIED
                    </div>
                    </div>
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
