<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ecowise V2 Intelligence Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }
            }
          }
        }
      }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/map/js/world.js"></script>

    <style>
        :root {
            --bg: #08111f;
            --bg-elevated: #0f1b2d;
            --panel: rgba(19, 34, 56, 0.86);
            --border: rgba(36, 55, 84, 0.92);
            --text: #ecf2f8;
            --text-soft: #9fb0c7;
            --text-dim: #6f829c;
            --projects: #19c28f;
            --investors: #4f7cff;
            --volunteers: #8a7cf7;
            --ngos: #c89a3d;
            --teal: #0ea5a4;
        }
        body { margin: 0; background: radial-gradient(circle at top left, rgba(25,194,143,0.08), transparent 28%), linear-gradient(180deg, #08111f 0%, #0d1728 52%, #101a2c 100%); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .tab-btn { padding: 0.75rem 1.5rem; border-bottom: 2px solid transparent; color: var(--text-soft); transition: all 0.2s; cursor: pointer; }
        .tab-btn.active { color: var(--projects); border-bottom-color: var(--projects); font-weight: 500; }
        .tab-btn:hover:not(.active) { color: var(--text); border-bottom-color: var(--border); }
        .premium-card { background-color: var(--panel); border: 1px solid var(--border); border-radius: 0.95rem; padding: 1.5rem; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.22); transition: transform 0.2s; }
        .premium-card:hover { border-color: rgba(25, 194, 143, 0.34); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const COLORS = {
            bg: '#08111f',
            bgElevated: '#0f1b2d',
            panel: '#132238',
            panelSoft: 'rgba(15,27,45,0.78)',
            border: '#243754',
            text: '#ecf2f8',
            textSoft: '#9fb0c7',
            textDim: '#6f829c',
            projects: '#19c28f',
            investors: '#4f7cff',
            volunteers: '#8a7cf7',
            ngos: '#c89a3d',
            teal: '#0ea5a4'
        };
        const GEO_BOUNDS = { minLat: -55, maxLat: 80, width: 1000, height: 520 };
        const GEO_LAYER_META = {
            activity_count: { label: 'Activities', tone: COLORS.projects },
            ecosystem_total: { label: 'Ecosystem Total', tone: '#56d5d0' },
            project_count: { label: 'Projects', tone: COLORS.investors },
            volunteer_count: { label: 'Volunteers', tone: COLORS.volunteers },
            investor_count: { label: 'Investors', tone: COLORS.ngos }
        };

        const geoMetricValue = (point, layer) => Number(point?.[layer] || 0);
        const projectGeoPoint = (lat, lon) => {
            const clampedLat = Math.min(GEO_BOUNDS.maxLat, Math.max(GEO_BOUNDS.minLat, Number(lat || 0)));
            return {
                x: ((Number(lon || 0) + 180) / 360) * GEO_BOUNDS.width,
                y: ((GEO_BOUNDS.maxLat - clampedLat) / (GEO_BOUNDS.maxLat - GEO_BOUNDS.minLat)) * GEO_BOUNDS.height
            };
        };

        const ReactEChart = ({ option, style, onClick }) => {
            const chartRef = useRef(null);
            const [chartError, setChartError] = useState(null);
            useEffect(() => {
                let chart;
                setChartError(null);
                try {
                    if (chartRef.current) {
                        chart = echarts.init(chartRef.current, 'dark', { renderer: 'canvas' });
                        chart.setOption({ ...option, backgroundColor: 'transparent', textStyle: { color: COLORS.textSoft } });
                        if (onClick) {
                            chart.on('click', onClick);
                        }
                    }
                } catch (error) {
                    console.error('ECharts render failed', error);
                    setChartError(error?.message || 'Chart failed to render');
                }
                const handleResize = () => chart && chart.resize();
                window.addEventListener('resize', handleResize);
                return () => {
                    if (chart && onClick) {
                        chart.off('click', onClick);
                    }
                    chart && chart.dispose();
                    window.removeEventListener('resize', handleResize);
                };
            }, [option, onClick]);
            if (chartError) {
                return (
                    <div
                        className="flex items-center justify-center rounded-2xl border text-sm text-slate-400"
                        style={{ width: '100%', height: '100%', borderColor: COLORS.border, backgroundColor: 'rgba(8,17,31,0.84)', ...style }}
                    >
                        {chartError}
                    </div>
                );
            }
            return <div ref={chartRef} style={{ width: '100%', height: '100%', ...style }} />;
        };

        const IconRefresh = ({spinning}) => <svg width="20" height="20" className={spinning ? "animate-spin text-emerald-500" : "text-emerald-500"} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M21 21v-5h-5"/></svg>;
        const IconCheck = () => <svg width="20" height="20" className="text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;

        function Dashboard() {
            const [activeTab, setActiveTab] = useState(1);
            const [overview, setOverview] = useState(null);
            const [entities, setEntities] = useState(null);
            const [clusters, setClusters] = useState(null);
            const [worldMapReady, setWorldMapReady] = useState(() => typeof echarts !== 'undefined' && typeof echarts.getMap === 'function' && !!echarts.getMap('world'));
            const [geoLayer, setGeoLayer] = useState('activity_count');
            const [geoPlaceType, setGeoPlaceType] = useState('all');
            const [geoSector, setGeoSector] = useState('All sectors');
            const [selectedGeoId, setSelectedGeoId] = useState(null);

            useEffect(() => {
                const loadData = async () => {
                    const host = "http://localhost:8000";
                    try {
                        const [resOv, resEn, resCl] = await Promise.all([
                            fetch(`${host}/api/v2/analytics/overview`),
                            fetch(`${host}/api/v2/analytics/entities`),
                            fetch(`${host}/api/v2/analytics/clusters`)
                        ]);
                        if (resOv.ok) setOverview(await resOv.json());
                        if (resEn.ok) setEntities(await resEn.json());
                        if (resCl.ok) setClusters(await resCl.json());
                    } catch (error) {
                        console.error("V2 API Connection Refused", error);
                    }
                };
                loadData();
            }, []);

            useEffect(() => {
                let cancelled = false;
                const hasWorldMap = typeof echarts !== 'undefined' && typeof echarts.getMap === 'function' && !!echarts.getMap('world');
                if (hasWorldMap) {
                    setWorldMapReady(true);
                    return;
                }

                const sources = [
                    'https://code.highcharts.com/mapdata/custom/world.geo.json',
                    'https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson'
                ];

                const registerWorldMap = async () => {
                    for (const url of sources) {
                        try {
                            const response = await fetch(url);
                            if (!response.ok) continue;
                            const geoJson = await response.json();
                            if (cancelled) return;
                            if (geoJson && typeof echarts?.registerMap === 'function') {
                                echarts.registerMap('world', geoJson);
                                setWorldMapReady(true);
                                return;
                            }
                        } catch (error) {
                            console.warn('World map source failed', url, error);
                        }
                    }
                    if (!cancelled) {
                        setWorldMapReady(false);
                    }
                };

                registerWorldMap();
                return () => {
                    cancelled = true;
                };
            }, []);

            useEffect(() => {
                const points = entities?.activity_geography_map?.points || [];
                if (!points.length) return;
                if (!selectedGeoId || !points.some(point => point.id === selectedGeoId)) {
                    setSelectedGeoId(points[0].id);
                }
            }, [entities, selectedGeoId]);

            if (!overview || !entities || !clusters) {
                return (
                    <div className="min-h-screen flex items-center justify-center flex-col gap-4 text-slate-400">
                        <IconRefresh spinning={true} />
                        <p>Booting Ecowise V2 Intelligence Subsystems...</p>
                    </div>
                );
            }

            const p1_donutOption = {
                tooltip: { trigger: 'item' },
                series: [{
                    name: 'Ecosystem Share',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    data: overview.entity_composition,
                    itemStyle: { borderRadius: 4, borderColor: COLORS.panel, borderWidth: 2 },
                    label: { color: COLORS.textSoft }
                }],
                color: [COLORS.projects, COLORS.investors, COLORS.volunteers, COLORS.ngos]
            };

            const p1_regionBarOption = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: { textStyle: { color: COLORS.textSoft } },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: { type: 'value', splitLine: { lineStyle: { color: COLORS.border } }, axisLabel: { color: COLORS.textDim } },
                yAxis: { type: 'category', data: overview.regional_distribution.map(d => d.region), axisLabel: { color: COLORS.textSoft } },
                series: [
                    { name: 'Projects', type: 'bar', stack: 'total', data: overview.regional_distribution.map(d => d.Projects) },
                    { name: 'Investors', type: 'bar', stack: 'total', data: overview.regional_distribution.map(d => d.Investors) },
                    { name: 'Volunteers', type: 'bar', stack: 'total', data: overview.regional_distribution.map(d => d.Volunteers) },
                    { name: 'NGOs', type: 'bar', stack: 'total', data: overview.regional_distribution.map(d => d.NGOs) }
                ],
                color: [COLORS.projects, COLORS.investors, COLORS.volunteers, COLORS.ngos]
            };

            const p1_stageOption = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                xAxis: { type: 'category', data: overview.stage_distribution.map(d => d.name), axisLabel: { color: COLORS.textSoft, rotate: 18 } },
                yAxis: { type: 'value', splitLine: { lineStyle: { color: COLORS.border } }, axisLabel: { color: COLORS.textDim } },
                series: [{ type: 'bar', data: overview.stage_distribution.map(d => d.val), itemStyle: { color: COLORS.projects }, barWidth: '46%' }]
            };

            const p1_coverageOption = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: { textStyle: { color: COLORS.textSoft } },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                xAxis: { type: 'value', splitLine: { lineStyle: { color: COLORS.border } }, axisLabel: { color: COLORS.textDim } },
                yAxis: { type: 'category', data: overview.match_coverage.map(d => d.entity), axisLabel: { color: COLORS.textSoft } },
                series: [
                    { name: 'Matched Projects', type: 'bar', data: overview.match_coverage.map(d => d.matched_projects), itemStyle: { color: COLORS.investors } },
                    { name: 'Avg Top Score', type: 'bar', data: overview.match_coverage.map(d => d.avg_top_score), itemStyle: { color: COLORS.ngos } }
                ]
            };

            const p2_sectorStageHeatmapOption = {
                tooltip: { position: 'top' },
                grid: { height: '60%', top: '10%' },
                xAxis: { type: 'category', data: entities.project_sector_stage_heatmap.xAxis, splitArea: { show: true } },
                yAxis: { type: 'category', data: entities.project_sector_stage_heatmap.yAxis, splitArea: { show: true } },
                visualMap: { min: 0, max: 50, calculable: true, orient: 'horizontal', left: 'center', bottom: '1%', textStyle: { color: COLORS.textSoft }, inRange: { color: [COLORS.panel, COLORS.projects] } },
                series: [{ type: 'heatmap', data: entities.project_sector_stage_heatmap.data, label: { show: true, color: '#fff' } }]
            };

            const p2_reportingRiskHeatmapOption = {
                tooltip: { position: 'top' },
                xAxis: { type: 'category', data: ['Low', 'Med', 'High'], name: 'Burden', nameLocation: 'middle', nameGap: 30 },
                yAxis: { type: 'category', data: ['Low', 'Med', 'High'], name: 'Risk', nameLocation: 'middle', nameGap: 30 },
                visualMap: { show: false, min: 0, max: 40, inRange: { color: [COLORS.panel, COLORS.volunteers] } },
                series: [{
                    type: 'heatmap',
                    data: [
                        [0,0,entities.investor_risk_reporting_matrix[0][0]], [1,0,entities.investor_risk_reporting_matrix[0][1]], [2,0,entities.investor_risk_reporting_matrix[0][2]],
                        [0,1,entities.investor_risk_reporting_matrix[1][0]], [1,1,entities.investor_risk_reporting_matrix[1][1]], [2,1,entities.investor_risk_reporting_matrix[1][2]],
                        [0,2,entities.investor_risk_reporting_matrix[2][0]], [1,2,entities.investor_risk_reporting_matrix[2][1]], [2,2,entities.investor_risk_reporting_matrix[2][2]]
                    ],
                    label: { show: true, color: '#fff' }
                }]
            };

            const p2_skillGapOption = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: { textStyle: { color: COLORS.textSoft } },
                yAxis: { type: 'category', data: entities.skill_demand_supply.map(s => s.skill), axisLabel: { color: COLORS.textSoft } },
                xAxis: { type: 'value', splitLine: { lineStyle: { color: COLORS.border } }, axisLabel: { color: COLORS.textDim } },
                series: [
                    { name: 'Demand (Projects)', type: 'bar', itemStyle: { color: COLORS.ngos }, data: entities.skill_demand_supply.map(s => s.demand) },
                    { name: 'Supply (Volunteers)', type: 'bar', itemStyle: { color: COLORS.investors }, data: entities.skill_demand_supply.map(s => s.supply) }
                ]
            };

            const p2_fundingOption = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                xAxis: { type: 'category', data: entities.funding_histogram.map(d => d.band), axisLabel: { color: COLORS.textSoft } },
                yAxis: { type: 'value', splitLine: { lineStyle: { color: COLORS.border } }, axisLabel: { color: COLORS.textDim } },
                series: [{ type: 'bar', data: entities.funding_histogram.map(d => d.count), itemStyle: { color: COLORS.teal }, barWidth: '46%' }]
            };

            const p2_geoOption = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                xAxis: { type: 'value', splitLine: { lineStyle: { color: COLORS.border } }, axisLabel: { color: COLORS.textDim } },
                yAxis: { type: 'category', data: entities.top_project_geographies.map(d => d.name), axisLabel: { color: COLORS.textSoft } },
                series: [{ type: 'bar', data: entities.top_project_geographies.map(d => d.val), itemStyle: { color: COLORS.volunteers } }]
            };

            const semanticTypes = [...new Set(clusters.semantic_map.map(node => node.type))];
            const graphColors = {
                project: COLORS.projects,
                investor: COLORS.investors,
                volunteer: COLORS.volunteers,
                grant: COLORS.ngos,
                precedent: COLORS.teal
            };
            const p3_scatterOption = {
                title: { text: 'Semantic Landscape (t-SNE projection)', textStyle: { color: COLORS.textSoft, fontSize: 12 }, left: 'center' },
                tooltip: {
                    formatter: params => {
                        const item = params.data.meta;
                        return `<b>${item.name}</b><br/>${item.type}<br/>Sector: ${item.sector}<br/>Region: ${item.region}`;
                    }
                },
                legend: { data: semanticTypes, top: 'bottom', textStyle: { color: COLORS.textSoft } },
                xAxis: { scale: true, show: false },
                yAxis: { scale: true, show: false },
                series: semanticTypes.map(type => ({
                    name: type,
                    type: 'scatter',
                    symbolSize: type === 'Project' ? 9 : 12,
                    data: clusters.semantic_map.filter(node => node.type === type).map(node => ({
                        value: [node.x, node.y],
                        meta: node
                    })),
                    itemStyle: { opacity: 0.84 }
                })),
                color: [COLORS.projects, COLORS.investors, COLORS.volunteers, COLORS.teal]
            };

            const p3_corridorOption = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: { textStyle: { color: COLORS.textSoft } },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '14%', containLabel: true },
                xAxis: { type: 'value', max: 100, splitLine: { lineStyle: { color: COLORS.border } }, axisLabel: { color: COLORS.textDim } },
                yAxis: { type: 'category', data: clusters.match_corridors.map(d => d.sector), axisLabel: { color: COLORS.textSoft } },
                series: [
                    { name: 'Investor Fit', type: 'bar', data: clusters.match_corridors.map(d => d.avg_investor_score), itemStyle: { color: COLORS.investors } },
                    { name: 'Volunteer Fit', type: 'bar', data: clusters.match_corridors.map(d => d.avg_volunteer_score), itemStyle: { color: COLORS.volunteers } },
                    { name: 'Grant Fit', type: 'bar', data: clusters.match_corridors.map(d => d.avg_grant_score), itemStyle: { color: COLORS.ngos } },
                    { name: 'Precedent Fit', type: 'bar', data: clusters.match_corridors.map(d => d.avg_precedent_score), itemStyle: { color: COLORS.teal } }
                ]
            };

            const p3_graphOption = {
                tooltip: {
                    formatter: params => {
                        if (params.dataType === 'edge') {
                            return `<b>${params.data.relation}</b><br/>Score: ${params.data.value}<br/>${params.data.rationale}`;
                        }
                        return `<b>${params.data.name}</b><br/>${params.data.group}<br/>${params.data.subtitle || ''}`;
                    }
                },
                series: [{
                    type: 'graph',
                    layout: 'force',
                    roam: true,
                    draggable: true,
                    label: { show: true, color: '#e2e8f0', fontSize: 10 },
                    force: { repulsion: 220, edgeLength: 96 },
                    data: clusters.match_network.nodes.map(node => ({
                        ...node,
                        symbolSize: Math.max(18, Math.min(42, 14 + Math.sqrt(node.value || 1))),
                        itemStyle: { color: graphColors[node.group] || COLORS.textSoft }
                    })),
                    links: clusters.match_network.edges.map(edge => ({
                        ...edge,
                        lineStyle: { color: COLORS.border, width: Math.max(1.5, Math.min(6, (edge.value || 1) / 20)), opacity: 0.82 }
                    }))
                }]
            };

            const geoMap = entities.activity_geography_map || { points: [], filters: { sectors: [] }, summary: {} };
            const filteredGeoPoints = [...(geoMap.points || [])]
                .filter(point => geoPlaceType === 'all' || point.place_type === geoPlaceType)
                .filter(point => geoSector === 'All sectors' || Number((point.sector_counts || {})[geoSector] || 0) > 0)
                .sort((left, right) => {
                    const metricGap = geoMetricValue(right, geoLayer) - geoMetricValue(left, geoLayer);
                    if (metricGap !== 0) return metricGap;
                    return (right.activity_count || 0) - (left.activity_count || 0);
                });
            const mappedGeoPoints = filteredGeoPoints.filter(point => point.is_mappable && geoMetricValue(point, geoLayer) > 0);
            const activeGeoPoint = filteredGeoPoints.find(point => point.id === selectedGeoId) || filteredGeoPoints[0] || null;
            const topGeoLabelIds = filteredGeoPoints.slice(0, 8).map(point => point.id);
            const maxGeoMetric = Math.max(...mappedGeoPoints.map(point => geoMetricValue(point, geoLayer)), 1);
            const geoSeriesData = mappedGeoPoints.map(point => ({
                name: point.name,
                value: [Number(point.lon || 0), Number(point.lat || 0), geoMetricValue(point, geoLayer)],
                point
            }));
            const geoLabelData = geoSeriesData.filter(item => topGeoLabelIds.includes(item.point.id));
            const geoSelectedData = activeGeoPoint && activeGeoPoint.is_mappable ? [{
                name: activeGeoPoint.name,
                value: [Number(activeGeoPoint.lon || 0), Number(activeGeoPoint.lat || 0), geoMetricValue(activeGeoPoint, geoLayer)],
                point: activeGeoPoint
            }] : [];

            const p4_geoOption = {
                animationDuration: 600,
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(8,17,31,0.94)',
                    borderColor: COLORS.border,
                    textStyle: { color: COLORS.text },
                    formatter: params => {
                        const point = params?.data?.point;
                        if (!point) {
                            return params.name || '';
                        }
                        return [
                            `<b>${point.name}</b>`,
                            point.place_type === 'country' ? 'Country' : 'Regional Program',
                            `${GEO_LAYER_META[geoLayer].label}: ${geoMetricValue(point, geoLayer)}`,
                            `Activities: ${point.activity_count || 0}`,
                            `Projects: ${point.project_count || 0}`,
                            `Volunteers: ${point.volunteer_count || 0}`,
                            `Investors: ${point.investor_count || 0}`,
                            `Sector: ${point.dominant_sector || 'General'}`
                        ].join('<br/>');
                    }
                },
                geo: {
                    map: 'world',
                    roam: true,
                    left: 0,
                    right: 0,
                    top: 0,
                    bottom: 0,
                    itemStyle: {
                        areaColor: '#0d1c30',
                        borderColor: 'rgba(111,130,156,0.45)',
                        borderWidth: 0.8
                    },
                    emphasis: {
                        itemStyle: {
                            areaColor: '#16314d'
                        },
                        label: { show: false }
                    },
                    silent: false
                },
                series: [
                    {
                        name: GEO_LAYER_META[geoLayer].label,
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        data: geoSeriesData,
                        symbolSize: value => 8 + Math.sqrt((value?.[2] || 0) / maxGeoMetric) * 28,
                        itemStyle: {
                            color: GEO_LAYER_META[geoLayer].tone,
                            opacity: 0.72,
                            shadowBlur: 18,
                            shadowColor: GEO_LAYER_META[geoLayer].tone
                        },
                        emphasis: {
                            scale: true,
                            itemStyle: { opacity: 0.96 }
                        }
                    },
                    {
                        type: 'effectScatter',
                        coordinateSystem: 'geo',
                        data: geoLabelData,
                        symbolSize: value => 10 + Math.sqrt((value?.[2] || 0) / maxGeoMetric) * 18,
                        rippleEffect: { scale: 3.2, brushType: 'stroke' },
                        itemStyle: {
                            color: GEO_LAYER_META[geoLayer].tone,
                            shadowBlur: 24,
                            shadowColor: GEO_LAYER_META[geoLayer].tone
                        },
                        label: {
                            show: true,
                            formatter: '{b}',
                            position: 'right',
                            color: COLORS.text,
                            fontSize: 11
                        },
                        labelLayout: { hideOverlap: true }
                    },
                    {
                        type: 'effectScatter',
                        coordinateSystem: 'geo',
                        data: geoSelectedData,

                                                ))}
                                                {[...mappedGeoPoints]
                                                    .sort((left, right) => geoMetricValue(left, geoLayer) - geoMetricValue(right, geoLayer))
                                                    .map(point => {
                                                        const { x, y } = projectGeoPoint(point.lat, point.lon);
                                                        const metric = geoMetricValue(point, geoLayer);
                                                        const radius = 7 + Math.sqrt(metric / maxGeoMetric) * 26;
                                                        const selected = activeGeoPoint && activeGeoPoint.id === point.id;
                                                        const showLabel = topGeoLabelIds.includes(point.id);
                                                        return (
                                                            <g key={point.id} onClick={() => setSelectedGeoId(point.id)} style={{ cursor: 'pointer' }}>
                                                                <circle
                                                                    cx={x}
                                                                    cy={y}
                                                                    r={radius}
                                                                    fill={selected ? COLORS.text : GEO_LAYER_META[geoLayer].tone}
                                                                    fillOpacity={selected ? 0.96 : 0.74}
                                                                    stroke={selected ? GEO_LAYER_META[geoLayer].tone : 'rgba(236,242,248,0.18)'}
                                                                    strokeWidth={selected ? 3 : 1.5}
                                                                />
                                                                <circle
                                                                    cx={x}
                                                                    cy={y}
                                                                    r={radius + 6}
                                                                    fill="none"
                                                                    stroke={selected ? 'rgba(236,242,248,0.42)' : 'rgba(236,242,248,0.06)'}
                                                                    strokeWidth={1}
                                                                />
                                                                {showLabel && (
                                                                    <text x={x} y={Math.max(18, y - radius - 10)} fill={selected ? COLORS.text : COLORS.textSoft} fontSize="13" textAnchor="middle">
                                                                        {point.name}
                                                                    </text>
                                                                )}
                                                            </g>
                                                        );
                                                    })}
                                            </svg>
                                        )}

                                        <div className="pointer-events-none absolute left-4 top-4 rounded-xl border px-4 py-3" style={{ borderColor: COLORS.border, backgroundColor: 'rgba(8,17,31,0.84)' }}>
                                            <div className="text-xs uppercase tracking-[0.18em] text-slate-500">Active layer</div>
                                            <div className="mt-2 text-lg" style={{ color: GEO_LAYER_META[geoLayer].tone }}>{GEO_LAYER_META[geoLayer].label}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="premium-card">
                                    <div className="flex items-start justify-between gap-4 mb-4">
                                        <div>
                                            <h4 className="text-sm text-slate-300 mb-2">Hotspot Ranking</h4>
                                            <p className="text-sm text-slate-500 leading-relaxed">
                                                Ranked by the selected layer so we can immediately see where activity, projects, volunteers, or investors are densest.
                                            </p>
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        {filteredGeoPoints.slice(0, 10).map(point => {
                                            const selected = activeGeoPoint && activeGeoPoint.id === point.id;
                                            return (
                                                <button
                                                    key={point.id}
                                                    onClick={() => setSelectedGeoId(point.id)}
                                                    className="flex w-full items-center justify-between gap-4 rounded-xl border px-4 py-3 text-left transition"
                                                    style={selected
                                                        ? { borderColor: COLORS.projects, backgroundColor: 'rgba(25,194,143,0.10)' }
                                                        : { borderColor: COLORS.border, backgroundColor: COLORS.panelSoft }}
                                                >
                                                    <div>
                                                        <div className="text-sm text-white">{point.name}</div>
                                                        <div className="mt-1 text-xs uppercase tracking-[0.16em] text-slate-500">
                                                            {point.place_type === 'country' ? 'Country' : 'Regional Program'} | {point.dominant_sector}
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-lg font-light" style={{ color: GEO_LAYER_META[geoLayer].tone }}>
                                                            {geoMetricValue(point, geoLayer)}
                                                        </div>
                                                        <div className="text-xs text-slate-400">activities: {point.activity_count || 0}</div>
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
